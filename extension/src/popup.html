<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYRA // Phishing Guard</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body {
      width: 370px;
      min-height: 520px;
      margin: 0;
      padding: 0;
    }

    .wrap { padding: 10px; display: flex; flex-direction: column; gap: 8px; }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-name { font-size: 15px; font-weight: 800; color: var(--text); letter-spacing: 0.03em; }
    .brand-sub  { font-size: 9px; color: var(--muted); margin-top: 1px; }

    /* URL chip */
    .url-chip {
      padding: 7px 12px;
      background: var(--sub);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 5px;
      overflow: hidden;
    }
    .url-scheme { color: var(--cyan); flex-shrink: 0; font-size: 11px; }
    .url-host   { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Verdict Card */
    .verdict-card {
      padding: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .verdict-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .verdict-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
    .score-row { display: flex; align-items: baseline; gap: 4px; margin-bottom: 8px; }
    .score-num { font-size: 36px; font-weight: 800; line-height: 1; color: var(--yellow); }
    .score-of  { font-size: 13px; color: var(--dim); }

    /* Pillars grid */
    .pillars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .pillar {
      padding: 9px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pillar-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .pillar-val   { font-size: 14px; font-weight: 800; color: var(--text); }
    .pillar-sub   { font-size: 10px; color: var(--dim); }

    /* SHAP box */
    .shap-box {
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .shap-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--cyan);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    /* Chain row */
    .chain-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 11px;
    }
    .chain-label { color: var(--muted); }
    .chain-val   { color: var(--purple); font-weight: 700; }

    /* Scan button */
    .scan-btn {
      width: 100%;
      padding: 11px;
      background: rgba(245,197,66,0.12);
      color: var(--yellow);
      border: 1px solid rgba(245,197,66,0.4);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .scan-btn:hover:not(:disabled) {
      background: rgba(245,197,66,0.22);
      border-color: rgba(245,197,66,0.7);
    }
    .scan-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 2px 0;
      font-size: 10px;
    }
    .footer-stats { color: var(--muted); }
    .footer-stats strong { color: var(--text); }
    .dash-link {
      color: var(--cyan);
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
    }
    .dash-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 2L4 8v10c0 9 6 16 14 18 8-2 14-9 14-18V8L18 2z" fill="url(#vg)"/>
        <path d="M13 18l4 4 7-7" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="vg" x1="4" y1="2" x2="32" y2="36" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4db8e8"/>
            <stop offset="100%" stop-color="#b07ef0"/>
          </linearGradient>
        </defs>
      </svg>
      <div>
        <div class="brand-name">VYRA</div>
        <div class="brand-sub">Phishing Guard</div>
      </div>
    </div>
    <span id="status-badge" class="badge badge-dim">READY</span>
  </div>

  <!-- URL chip -->
  <div class="url-chip">
    <span class="url-scheme" id="url-scheme">https://</span>
    <span class="url-host" id="url-display">Loading tab…</span>
  </div>

  <!-- Verdict card -->
  <div class="verdict-card" id="verdict-card">
    <div class="verdict-top">
      <span class="verdict-label">Risk Score</span>
      <span id="verdict-badge" class="badge badge-dim">—</span>
    </div>
    <div class="score-row">
      <span class="score-num" id="risk-score">—</span>
      <span class="score-of">/ 100</span>
    </div>
    <div class="score-track">
      <div class="score-fill" id="score-bar" style="width:0%"></div>
    </div>
  </div>

  <!-- Sub-intelligence pillars -->
  <div class="pillars">
    <div class="pillar">
      <span class="pillar-label">ML Confidence</span>
      <span class="pillar-val" id="sub-ml-score">—</span>
      <span id="sub-ml-tag" class="badge badge-dim" style="align-self:flex-start">—</span>
    </div>
    <div class="pillar">
      <span class="pillar-label">Threat Feeds</span>
      <span class="pillar-val" id="sub-feed-score">—</span>
      <span id="sub-feed-tag" class="badge badge-dim" style="align-self:flex-start">—</span>
    </div>
    <div class="pillar">
      <span class="pillar-label">TLS / Protocol</span>
      <span class="pillar-val" id="sub-tls-val" style="font-size:11px">—</span>
      <span id="sub-tls-tag" class="badge badge-dim" style="align-self:flex-start">—</span>
    </div>
    <div class="pillar">
      <span class="pillar-label">Domain Age</span>
      <span class="pillar-val" id="sub-domain-val" style="font-size:12px">—</span>
      <span id="sub-domain-tag" class="badge badge-dim" style="align-self:flex-start">—</span>
    </div>
  </div>

  <!-- SHAP features -->
  <div class="shap-box" id="shap-container" style="display:none">
    <div class="shap-title">
      <span>Key Risk Factors (SHAP)</span>
      <span class="text-muted">XAI</span>
    </div>
    <div id="shap-mini-list"></div>
  </div>

  <!-- Blockchain notarization -->
  <div class="chain-row">
    <span class="chain-label">Blockchain audit</span>
    <span class="chain-val" id="chain-block-num">Block #—</span>
  </div>

  <!-- Scan button -->
  <button class="scan-btn" id="btn-scan">
    <span id="btn-scan-text">⚡ Scan This Page</span>
  </button>

  <!-- Footer stats -->
  <div class="footer">
    <span class="footer-stats">
      Today: <strong id="stat-scans">0</strong> scans &nbsp;·&nbsp;
      <strong id="stat-threats" style="color:var(--red)">0</strong> blocked
    </span>
    <a class="dash-link" href="http://localhost:3000" target="_blank">Dashboard ↗</a>
  </div>

</div>
<script src="popup.js"></script>
</body>
</html>
